name: PHP package verification

on:
  pull_request:
    branches:
      - main
      - phase-draft/rc-1
  push:
    branches:
      - main
      - phase-draft/rc-1

permissions:
  contents: read

concurrency:
  group: php-slug-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  latest-quality:
    name: Latest compatible quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, pdo, pdo_mysql
          coverage: none
          tools: composer:2.10
        env:
          update: true
      - name: Verify the installed Stable PHP patch
        run: bash tools/ci/run-gate.sh php-runtime "8.5"
      - name: Run latest quality gate
        env:
          COMPOSER_NO_AUDIT: '0'
        run: bash tools/ci/run-gate.sh latest-quality

  latest-quality-8-4:
    name: Latest quality on PHP 8.4
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo, pdo_mysql
          coverage: none
          tools: composer:2.10
        env:
          update: true
      - name: Verify the installed Stable PHP patch
        run: bash tools/ci/run-gate.sh php-runtime "8.4"
      - name: Run latest quality gate
        env:
          COMPOSER_NO_AUDIT: '0'
        run: bash tools/ci/run-gate.sh latest-quality

  full-tests:
    name: Full PHPUnit on PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'
    steps:
      - name: Checkout current commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo, pdo_mysql, pdo_sqlite
          coverage: none
          tools: composer:2.10
        env:
          update: true
      - name: Verify the installed Stable PHP patch
        run: bash tools/ci/run-gate.sh php-runtime "${{ matrix.php }}"
      - name: Run full test gate
        env:
          COMPOSER_NO_AUDIT: '0'
        run: bash tools/ci/run-gate.sh latest-tests
      - name: Run the MariaDB snapshot and PDO regression gate
        if: matrix.php == '8.5'
        run: bash tools/ci/run-gate.sh mariadb-snapshot

  lowest-tests:
    name: Lowest dependencies on PHP 8.4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout current commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo, pdo_mysql, pdo_sqlite
          coverage: none
          tools: composer:2.10
        env:
          update: true
      - name: Verify the installed Stable PHP patch
        run: bash tools/ci/run-gate.sh php-runtime "8.4"
      - name: Run lowest dependency gate
        env:
          COMPOSER_NO_AUDIT: '0'
        run: bash tools/ci/run-gate.sh lowest-tests

  consumer-harness:
    name: Consumer Harness on PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'
    steps:
      - name: Checkout current commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo, pdo_mysql
          coverage: none
          tools: composer:2.10
        env:
          update: true
      - name: Verify the installed Stable PHP patch
        run: bash tools/ci/run-gate.sh php-runtime "${{ matrix.php }}"
      - name: Run clean consumer Harness twice
        env:
          COMPOSER_NO_AUDIT: '0'
        run: bash tools/ci/run-gate.sh consumer

  examples-smoke:
    name: Examples smoke on PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'
    steps:
      - name: Checkout current commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo, pdo_mysql
          coverage: none
          tools: composer:2.10
        env:
          update: true
      - name: Verify the installed Stable PHP patch
        run: bash tools/ci/run-gate.sh php-runtime "${{ matrix.php }}"
      - name: Run stateless and persisted example smoke gate
        env:
          COMPOSER_NO_AUDIT: '0'
        run: bash tools/ci/run-gate.sh examples-smoke

  runtime-portability:
    name: Runtime portability on macOS / PHP 8.5
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout current commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install bottled PHP 8.5
        timeout-minutes: 5
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_FORCE_API_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install --force-bottle homebrew/core/php@8.5
          printf '%s\n' "$(brew --prefix homebrew/core/php@8.5)/bin" >> "$GITHUB_PATH"
      - name: Verify the installed Stable PHP patch
        run: bash tools/ci/run-gate.sh php-runtime "8.5"
      - name: Install Composer 2.10.3
        timeout-minutes: 2
        run: |
          composer_bin="$RUNNER_TEMP/slug-composer-bin"
          mkdir -p "$composer_bin"
          curl --fail --silent --show-error --location --max-time 60 \
            --output "$composer_bin/composer" https://getcomposer.org/download/2.10.3/composer.phar
          (
            cd "$composer_bin"
            printf '%s\n' '7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6  composer' | shasum -a 256 -c -
          )
          chmod +x "$composer_bin/composer"
          printf '%s\n' "$composer_bin" >> "$GITHUB_PATH"
      - name: Run runtime portability gate
        env:
          COMPOSER_NO_AUDIT: '0'
        run: bash tools/ci/run-gate.sh runtime-portability

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Run pinned actionlint validator
        run: bash tools/ci/run-gate.sh workflow-lint

  whitespace:
    name: Committed whitespace verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI_COMPARISON_RANGE: ${{ github.event_name == 'pull_request' && format('{0}...{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}...{1}', github.event.before, github.sha) }}
    steps:
      - name: Checkout current commit and comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Check the committed comparison range
        run: bash tools/ci/run-gate.sh whitespace "$CI_COMPARISON_RANGE"

  release-artifact:
    name: Release Artifact Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_ARTIFACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RELEASE_ARTIFACT_TARGET: '1.0.0-rc.3'
    steps:
      - name: Checkout the exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_ARTIFACT_SHA }}
          fetch-depth: 0
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: dom, intl, mbstring, pdo, pdo_mysql
          coverage: none
          tools: composer:2.10
        env:
          update: true
      - name: Verify the installed Stable PHP patch
        run: bash tools/ci/run-gate.sh php-runtime "8.5"
      - name: Install pinned cmark-gfm
        run: |
          markdown_tools="$RUNNER_TEMP/slug-release-markdown"
          bash tools/ci/install-release-markdown.sh "$markdown_tools"
          printf '%s\n' "$markdown_tools/bin" >> "$GITHUB_PATH"
      - name: Run release inactivity regression tests
        run: bash tools/ci/test-release-artifact-inactive.sh
      - name: Run release archive regression tests
        run: bash tools/ci/test-release-artifact-active.sh
      - name: Verify shell path portability with actual gate commands
        run: bash tools/ci/test-shell-paths.sh "$RELEASE_ARTIFACT_TARGET"
      - name: Verify the release artifact or inactive state
        run: bash tools/ci/run-gate.sh release-artifact "$RELEASE_ARTIFACT_SHA" "$RELEASE_ARTIFACT_TARGET"

  stable-gate:
    name: CI Gate (stable)
    if: ${{ always() }}
    needs:
      - latest-quality
      - latest-quality-8-4
      - full-tests
      - lowest-tests
      - consumer-harness
      - examples-smoke
      - workflow-lint
      - whitespace
      - runtime-portability
      - release-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed on every required upstream result
        env:
          LATEST_QUALITY: ${{ needs.latest-quality.result }}
          LATEST_QUALITY_8_4: ${{ needs.latest-quality-8-4.result }}
          FULL_TESTS: ${{ needs.full-tests.result }}
          LOWEST_TESTS: ${{ needs.lowest-tests.result }}
          CONSUMER_HARNESS: ${{ needs.consumer-harness.result }}
          EXAMPLES_SMOKE: ${{ needs.examples-smoke.result }}
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          WHITESPACE: ${{ needs.whitespace.result }}
          RUNTIME_PORTABILITY: ${{ needs.runtime-portability.result }}
          RELEASE_ARTIFACT: ${{ needs.release-artifact.result }}
        run: |
          set -euo pipefail
          for result in \
            "latest-quality:$LATEST_QUALITY" \
            "latest-quality-8-4:$LATEST_QUALITY_8_4" \
            "full-tests:$FULL_TESTS" \
            "lowest-tests:$LOWEST_TESTS" \
            "consumer-harness:$CONSUMER_HARNESS" \
            "examples-smoke:$EXAMPLES_SMOKE" \
            "workflow-lint:$WORKFLOW_LINT" \
            "whitespace:$WHITESPACE" \
            "release-artifact:$RELEASE_ARTIFACT"; do
            job="${result%%:*}"
            status="${result##*:}"
            if [[ "$status" != success ]]; then
              echo "Required CI job $job ended with unexpected status: $status" >&2
              exit 1
            fi
          done
          if [[ "$RUNTIME_PORTABILITY" != success ]]; then
            echo "Required CI job runtime-portability ended with unexpected status: $RUNTIME_PORTABILITY" >&2
            exit 1
          fi
          echo 'All required upstream jobs passed.'
