services:
  mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_DATABASE: maatify_slug_test
      MYSQL_USER: slug_test
      MYSQL_PASSWORD: slug_test_password
      MYSQL_ROOT_PASSWORD: slug_test_root_password
    volumes:
      - ./tests/Fixtures/Infrastructure/readonly-account.sql:/docker-entrypoint-initdb.d/010-readonly-account.sql:ro
    ports:
      - "127.0.0.1::3306"
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -pslug_test_root_password
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
  mariadb:
    profiles: [mariadb]
    image: mariadb:12.3.2@sha256:a02fe89cb597d4375812b2eac90cf9d0775d4686daa7f7cc750ebbcad7525bbc
    command: ["--innodb-snapshot-isolation=OFF"]
    environment:
      MARIADB_DATABASE: maatify_slug_test
      MARIADB_USER: slug_test
      MARIADB_PASSWORD: slug_test_password
      MARIADB_ROOT_PASSWORD: slug_test_root_password
    volumes:
      - ./tests/Fixtures/Infrastructure/readonly-account.sql:/docker-entrypoint-initdb.d/010-readonly-account.sql:ro
    ports:
      - "127.0.0.1::3306"
